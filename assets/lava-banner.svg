<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Lava — Pompei Tech color themes</title>
  <desc id="desc">A warm orange sun above a volcanic landscape, with Lava lettering on an obsidian background.</desc>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E0AA50"/>
      <stop offset="1" stop-color="#E86B3F"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="280" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="280" fill="#0F0E0D"/>
    <circle cx="753" cy="117" r="70" fill="url(#sun)"/>
    <path d="M430 280 660 126 699 151 728 138 960 280Z" fill="#28221E"/>
    <path d="M554 280 724 165 748 182 770 158 960 280Z" fill="#181513"/>
    <path d="m660 126 39 25 29-13-22 35-18-6-24 28 9-34Z" fill="#E86B3F"/>
    <path d="m706 173-18 28 10 15-24 30 8 34" fill="none" stroke="#E86B3F" stroke-width="3"/>
    <path d="M460 250 650 216M754 231l153 35M574 279l66-36" fill="none" stroke="#3A302A" stroke-width="1"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="48" y="56" fill="#E86B3F" font-size="12" font-weight="700" letter-spacing="4">POMPEI TECH</text>
      <text x="44" y="155" fill="#F5EFE8" font-size="100" font-weight="700" letter-spacing="-5">Lava</text>
      <text x="48" y="194" fill="#A99D94" font-size="18">Warm stone. Glowing accents. A calmer workspace.</text>
      <rect x="48" y="229" width="18" height="5" rx="2" fill="#E86B3F"/>
      <rect x="72" y="229" width="18" height="5" rx="2" fill="#E0AA50"/>
      <rect x="96" y="229" width="18" height="5" rx="2" fill="#FAF6EF"/>
      <text x="128" y="237" fill="#A99D94" font-size="12" letter-spacing="2">DARK &amp; LIGHT</text>
    </g>
  </g>
</svg>
